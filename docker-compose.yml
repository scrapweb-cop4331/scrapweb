services:
  server:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./server:/app
    command: sh -c "npm install && npm start"
    ports:
      - "5000:5000"
    environment:
      - port=5000
      - mongo_connection_string=mongodb://mongo:27017/scrapweb
      - jwt_secret_key=${jwt_secret_key:-dev-secret-change-me}
      - server_host=${server_host:-localhost:5173}
      - sendgrid_api_key=${sendgrid_api_key:-}
    depends_on:
      - mongo

  client:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./client:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://server:5000
    depends_on:
      - server

  mongo:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
